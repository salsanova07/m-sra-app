<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mısra</title>
  <meta name="description" content="Yazma sürecinde yanında bir asistan." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mısra" />
  <meta property="og:title" content="Mısra" />
  <meta property="og:description" content="Yazma sürecinde yanında bir asistan." />
  <meta property="og:url" content="%OG_BASE%/" />
  <meta property="og:image" content="%OG_BASE%/static/icons/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Mısra — cennet ağacı yaprağı" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mısra" />
  <meta name="twitter:description" content="Yazma sürecinde yanında bir asistan." />
  <meta name="twitter:image" content="%OG_BASE%/static/icons/og-image.png" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1b1a17" />
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mısra" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-auth="%AUTH%">
  <div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Konuşmalar ve pano">
    <div class="sidebar-head">
      <button id="new-conv" class="new-conv" type="button">+ Yeni Konuşma</button>
      <div class="tabs">
        <button id="tab-conv" class="tab active" type="button">Konuşmalar</button>
        <button id="tab-pin" class="tab" type="button">Pano</button>
      </div>
    </div>
    <ul id="conv-list" class="conv-list"></ul>
    <ul id="pin-list" class="conv-list pin-list" hidden></ul>
    <div class="sidebar-foot">
      <button id="feedback-btn" class="feedback-btn" type="button">Öneri / Hata Bildir</button>
      <button id="logout-btn" class="feedback-btn" type="button">Çıkış yap</button>
    </div>
  </aside>
  <div class="overlay" id="overlay" hidden></div>

  <div class="chat-col">
  <header class="topbar">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="Konuşmaları aç">☰</button>
    <svg class="leaf" viewBox="0 0 120 210" role="img" aria-label="Cennet ağacı yaprağı" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="leaflet" d="M0,0 Q16,-8 38,-2 Q20,2 14,3 Q12,6 9,4 Q4,4 0,0 Z" />
      </defs>
      <g fill="currentColor" stroke="none">
        <path d="M60,206 C58,206 58,201 59,196 C60,150 61,150 60,96 C60,60 60,40 60,14"
              fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        <use href="#leaflet" transform="translate(60,190) rotate(-26) scale(1.05)" />
        <use href="#leaflet" transform="translate(60,190) scale(-1,1) rotate(-26) scale(1.05)" />
        <use href="#leaflet" transform="translate(60,166) rotate(-27) scale(1)" />
        <use href="#leaflet" transform="translate(60,166) scale(-1,1) rotate(-27) scale(1)" />
        <use href="#leaflet" transform="translate(60,142) rotate(-28) scale(0.94)" />
        <use href="#leaflet" transform="translate(60,142) scale(-1,1) rotate(-28) scale(0.94)" />
        <use href="#leaflet" transform="translate(60,118) rotate(-30) scale(0.86)" />
        <use href="#leaflet" transform="translate(60,118) scale(-1,1) rotate(-30) scale(0.86)" />
        <use href="#leaflet" transform="translate(60,95) rotate(-32) scale(0.76)" />
        <use href="#leaflet" transform="translate(60,95) scale(-1,1) rotate(-32) scale(0.76)" />
        <use href="#leaflet" transform="translate(60,73) rotate(-36) scale(0.64)" />
        <use href="#leaflet" transform="translate(60,73) scale(-1,1) rotate(-36) scale(0.64)" />
        <use href="#leaflet" transform="translate(60,52) rotate(-42) scale(0.5)" />
        <use href="#leaflet" transform="translate(60,52) scale(-1,1) rotate(-42) scale(0.5)" />
        <use href="#leaflet" transform="translate(60,14) rotate(-90) scale(0.6)" />
      </g>
    </svg>
    <div class="wordmark">
      <h1>Mısra</h1>
      <span class="subtitle">yazar asistanı</span>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="composer" class="composer">
    <textarea id="input" rows="1" placeholder="Bir şeyler yaz…" autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="Gönder">↑</button>
  </form>
  </div>
  </div>

  <dialog id="feedback-dialog" class="dialog">
    <form id="feedback-form">
      <h2>Geri Bildirim</h2>
      <label class="field">
        <span>Tür</span>
        <select id="fb-kind">
          <option value="suggestion">Öneri</option>
          <option value="bug">Hata</option>
        </select>
      </label>
      <label class="field">
        <span>Mesaj</span>
        <textarea id="fb-message" rows="5" maxlength="5000" required
                  placeholder="Ne önermek / bildirmek istersin?"></textarea>
      </label>
      <p id="fb-status" class="fb-status" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="fb-cancel" class="btn-ghost">İptal</button>
        <button type="submit" id="fb-send" class="btn-primary">Gönder</button>
      </div>
    </form>
  </dialog>

  <dialog id="pdf-dialog" class="dialog">
    <form id="pdf-form">
      <h2>PDF'e Dönüştür</h2>
      <label class="field">
        <span>Yazı tipi</span>
        <select id="pdf-font">
          <option value="times">Times New Roman</option>
          <option value="merriweather" selected>Merriweather</option>
          <option value="georgia">Georgia</option>
        </select>
      </label>
      <label class="field">
        <span>Metin hizalama</span>
        <select id="pdf-align">
          <option value="left">Sola yaslı</option>
          <option value="center">Ortalı</option>
          <option value="right">Sağa yaslı</option>
          <option value="justify" selected>İki yana yaslı</option>
        </select>
      </label>
      <label class="field">
        <span>Sayfa boyutu</span>
        <select id="pdf-size">
          <option value="a4">A4</option>
          <option value="a5" selected>A5</option>
          <option value="letter">Letter</option>
        </select>
      </label>
      <p id="pdf-status" class="fb-status" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="pdf-cancel" class="btn-ghost">Kapat</button>
        <button type="button" id="pdf-copy" class="btn-ghost">Metni Kopyala</button>
        <button type="submit" id="pdf-download" class="btn-primary">PDF İndir</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
